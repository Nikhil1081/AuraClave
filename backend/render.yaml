services:
  - type: web
    name: auraclave-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MEDIASOUP_ANNOUNCED_IP
        sync: false
      - key: MEDIASOUP_LISTEN_IP
        value: 0.0.0.0
      - key: MEDIASOUP_MIN_PORT
        value: 40000
      - key: MEDIASOUP_MAX_PORT
        value: 49999
