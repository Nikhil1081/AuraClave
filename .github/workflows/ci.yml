name: AuraClave CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auraclave
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: auraclave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auraclave -d auraclave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      PORT: 5000
      DATABASE_URL: postgresql://auraclave:ci-test-only@localhost:5432/auraclave_test
      TEST_DATABASE_URL: postgresql://auraclave:ci-test-only@localhost:5432/auraclave_test
      DATABASE_SSL: disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Run database migrations
        run: npm --prefix backend run db:migrate

      - name: Build backend (TypeScript)
        run: npm --prefix backend run build

      - name: Install frontend dependencies
        run: npm --prefix nexmeet install

      - name: Build frontend
        run: npm --prefix nexmeet run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: Run backend tests (PostgreSQL integration required)
        run: npm --prefix backend test

      - name: Run frontend tests
        # nexmeet has no test script yet; skip gracefully until tests are added
        run: |
          if npm --prefix nexmeet run 2>&1 | grep -q '"test"'; then
            npm --prefix nexmeet run test -- --run
          else
            echo "No frontend test script defined. Skipping."
          fi

      - name: Dependency vulnerability audit (backend)
        run: npm --prefix backend audit --audit-level=high
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
